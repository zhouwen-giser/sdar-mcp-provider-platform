{
  "components":
    {
      "parameters":
        {
          "ActorIdHeader":
            {
              "description": "Required audit actor identifier for mutating requests. It is not an authentication or authorization credential in V1.",
              "in": "header",
              "name": "X-Actor-ID",
              "required": true,
              "schema": { "maxLength": 128, "minLength": 1, "type": "string" },
            },
          "CorrelationIdHeader":
            {
              "description": "Optional trace correlation identifier. The server may generate one when absent.",
              "in": "header",
              "name": "X-Correlation-ID",
              "required": false,
              "schema":
                {
                  "maxLength": 128,
                  "minLength": 1,
                  "pattern": "^[A-Za-z0-9._:-]+$",
                  "type": "string",
                },
            },
        },
      "responses":
        {
          "Problem":
            {
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/ProblemDetails" } },
                },
              "description": "Mapped existing SMPP error",
            },
        },
      "schemas":
        {
          "AuditEvent":
            {
              "additionalProperties": false,
              "description": "Read-only projection returned by the current audit list route; metadata is intentionally not included.",
              "properties":
                {
                  "action": { "type": "string" },
                  "actorId": { "type": "string" },
                  "auditEventId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "correlationId": { "type": "string" },
                  "occurredAt": { "format": "date-time", "type": "string" },
                  "subjectId": { "type": "string" },
                  "subjectType": { "type": "string" },
                },
              "required":
                [
                  "auditEventId",
                  "action",
                  "actorId",
                  "correlationId",
                  "subjectType",
                  "subjectId",
                  "occurredAt",
                ],
              "type": "object",
            },
          "ConfigRevision":
            {
              "additionalProperties": false,
              "properties":
                {
                  "applyMode":
                    {
                      "enum": ["hot_reload", "reconnect_required", "restart_required", "immutable"],
                      "type": "string",
                    },
                  "checksum": { "pattern": "^[0-9a-f]{64}$", "type": "string" },
                  "content": { "$ref": "#/components/schemas/ConfigurationContent" },
                  "createdAt": { "format": "date-time", "type": "string" },
                  "revision": { "minimum": 1, "type": "integer" },
                  "revisionId": { "format": "uuid", "type": "string" },
                  "status":
                    {
                      "enum": ["draft", "validated", "published", "superseded", "rejected"],
                      "type": "string",
                    },
                  "target": { "$ref": "#/components/schemas/ConfigurationTarget" },
                },
              "required":
                [
                  "revisionId",
                  "target",
                  "revision",
                  "checksum",
                  "applyMode",
                  "status",
                  "content",
                  "createdAt",
                ],
              "type": "object",
            },
          "ConfigurationBusinessKey":
            {
              "additionalProperties": false,
              "properties":
                {
                  "configGroup": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "dataId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "environment": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "targetId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "targetType":
                    {
                      "enum":
                        [
                          "environment",
                          "provider_type",
                          "provider",
                          "runtime_deployment",
                          "runtime_instance",
                          "collector",
                        ],
                      "type": "string",
                    },
                },
              "required": ["environment", "targetType", "targetId", "configGroup", "dataId"],
              "type": "object",
            },
          "ConfigurationContent":
            {
              "additionalProperties": { "$ref": "#/components/schemas/ConfigurationValue" },
              "type": "object",
            },
          "ConfigurationDraft":
            {
              "additionalProperties": false,
              "properties":
                {
                  "ancestorTargetIds":
                    {
                      "additionalProperties":
                        { "maxLength": 128, "minLength": 1, "type": "string" },
                      "propertyNames":
                        {
                          "enum":
                            [
                              "environment",
                              "provider_type",
                              "provider",
                              "runtime_deployment",
                              "runtime_instance",
                              "collector",
                            ],
                        },
                      "type": "object",
                    },
                  "applyMode":
                    {
                      "enum": ["hot_reload", "reconnect_required", "restart_required", "immutable"],
                      "type": "string",
                    },
                  "content": { "$ref": "#/components/schemas/ConfigurationContent" },
                  "createdAt": { "format": "date-time", "type": "string" },
                  "definitionId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "definitionVersion": { "minimum": 1, "type": "integer" },
                  "draftId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "key": { "$ref": "#/components/schemas/ConfigurationBusinessKey" },
                  "status": { "enum": ["draft", "validated", "invalid"], "type": "string" },
                  "updatedAt": { "format": "date-time", "type": "string" },
                  "validationIssues":
                    {
                      "items": { "$ref": "#/components/schemas/ConfigurationValidationIssue" },
                      "type": "array",
                    },
                  "version": { "minimum": 1, "type": "integer" },
                },
              "required":
                [
                  "draftId",
                  "definitionId",
                  "definitionVersion",
                  "key",
                  "ancestorTargetIds",
                  "content",
                  "version",
                  "status",
                  "validationIssues",
                  "createdAt",
                  "updatedAt",
                ],
              "type": "object",
            },
          "ConfigurationPublicationResult":
            {
              "additionalProperties": false,
              "properties":
                {
                  "outcome": { "enum": ["published", "no_change"], "type": "string" },
                  "revision": { "$ref": "#/components/schemas/ConfigRevision" },
                },
              "required": ["outcome", "revision"],
              "type": "object",
            },
          "ConfigurationTarget":
            {
              "additionalProperties": false,
              "properties":
                {
                  "configGroup": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "dataId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "environment": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "targetId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "targetType":
                    {
                      "enum":
                        [
                          "environment",
                          "provider_type",
                          "provider",
                          "runtime_deployment",
                          "runtime_instance",
                          "collector",
                        ],
                      "type": "string",
                    },
                },
              "required": ["environment", "targetType", "targetId", "configGroup", "dataId"],
              "type": "object",
            },
          "ConfigurationValidationIssue":
            {
              "additionalProperties": false,
              "properties":
                {
                  "code":
                    {
                      "enum":
                        [
                          "IMMUTABLE_OVERRIDE",
                          "OVERRIDE_NOT_ALLOWED",
                          "PLAINTEXT_SECRET_REJECTED",
                          "SCHEMA_VALIDATION_FAILED",
                        ],
                      "type": "string",
                    },
                  "message": { "type": "string" },
                  "path": { "type": "string" },
                },
              "required": ["code", "path", "message"],
              "type": "object",
            },
          "ConfigurationValue":
            {
              "anyOf":
                [
                  { "type": "null" },
                  { "type": "boolean" },
                  { "type": "number" },
                  { "type": "string" },
                  { "$ref": "#/components/schemas/SecretRef" },
                  {
                    "items": { "$ref": "#/components/schemas/ConfigurationValue" },
                    "type": "array",
                  },
                  {
                    "additionalProperties": { "$ref": "#/components/schemas/ConfigurationValue" },
                    "type": "object",
                  },
                ],
            },
          "EffectiveConfigurationPreview":
            {
              "additionalProperties": false,
              "properties":
                {
                  "applyMode":
                    {
                      "enum": ["hot_reload", "reconnect_required", "restart_required", "immutable"],
                      "type": "string",
                    },
                  "content": { "$ref": "#/components/schemas/ConfigurationContent" },
                  "definitionId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "definitionVersion": { "minimum": 1, "type": "integer" },
                  "draftId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "issues":
                    {
                      "items": { "$ref": "#/components/schemas/ConfigurationValidationIssue" },
                      "type": "array",
                    },
                  "sources":
                    {
                      "additionalProperties":
                        {
                          "enum":
                            [
                              "system_default",
                              "environment",
                              "provider_type",
                              "provider",
                              "runtime_deployment",
                              "runtime_instance",
                              "collector",
                            ],
                          "type": "string",
                        },
                      "type": "object",
                    },
                  "valid": { "type": "boolean" },
                },
              "required":
                [
                  "draftId",
                  "definitionId",
                  "definitionVersion",
                  "content",
                  "sources",
                  "applyMode",
                  "valid",
                  "issues",
                ],
              "type": "object",
            },
          "PageInfo":
            {
              "additionalProperties": false,
              "properties": { "nextCursor": { "type": "string" } },
              "type": "object",
            },
          "ProblemCode":
            {
              "enum":
                [
                  "INVALID_REQUEST",
                  "INVALID_JSON",
                  "REQUEST_BODY_TOO_LARGE",
                  "INTERNAL_ERROR",
                  "ROUTE_NOT_FOUND",
                  "INVALID_IDENTIFIER",
                  "INVALID_DOMAIN_VALUE",
                  "INVALID_STATE_TRANSITION",
                  "DUPLICATE_RESOURCE_BINDING",
                  "RESOURCE_BINDING_NOT_FOUND",
                  "ENTITY_ALREADY_EXISTS",
                  "ENTITY_NOT_FOUND",
                  "OPTIMISTIC_CONCURRENCY_CONFLICT",
                  "LEASE_NOT_OWNED",
                  "RUNTIME_DEPLOYMENT_NOT_FOUND",
                  "RUNTIME_DEPLOYMENT_PROVIDER_UNAVAILABLE",
                  "RUNTIME_DEPLOYMENT_CONFIG_PROFILE_UNAVAILABLE",
                  "RUNTIME_DEPLOYMENT_DATABASE_PROFILE_UNAVAILABLE",
                  "RUNTIME_DEPLOYMENT_REPLICA_COUNT_UNSUPPORTED",
                  "RUNTIME_DEPLOYMENT_REVISION_CONFLICT",
                  "RUNTIME_PROCESS_NOT_FOUND",
                  "CONFIGURATION_DEFINITION_NOT_FOUND",
                  "CONFIGURATION_TARGET_NOT_ALLOWED",
                  "CONFIGURATION_BUSINESS_KEY_CONFLICT",
                  "CONFIGURATION_DRAFT_NOT_FOUND",
                  "CONFIGURATION_DRAFT_VERSION_CONFLICT",
                  "CONFIGURATION_DRAFT_NOT_VALIDATED",
                  "CONFIGURATION_PUBLISH_CONFLICT",
                  "CONFIGURATION_REVISION_NOT_FOUND",
                  "CONFIGURATION_ROLLBACK_TARGET_MISMATCH",
                  "CONFIGURATION_INPUT_INVALID",
                  "REGISTRY_SNAPSHOT_NOT_FOUND",
                ],
              "type": "string",
            },
          "ProblemDetails":
            {
              "additionalProperties": false,
              "description": "Transport projection of existing SMPP public errors. No retryability policy is frozen in V1.",
              "properties":
                {
                  "code": { "$ref": "#/components/schemas/ProblemCode" },
                  "correlationId": { "type": "string" },
                  "detail": { "type": "string" },
                  "requestId": { "type": "string" },
                  "status": { "maximum": 599, "minimum": 400, "type": "integer" },
                  "title": { "type": "string" },
                  "type":
                    {
                      "description": "Stable URN or URI identifying the problem category.",
                      "type": "string",
                    },
                },
              "required": ["type", "title", "status", "code"],
              "type": "object",
            },
          "Provider":
            {
              "additionalProperties": false,
              "properties":
                {
                  "adapterEndpoint": { "type": "string" },
                  "hostingMode":
                    { "enum": ["vendor_managed", "platform_managed"], "type": "string" },
                  "packageId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "packageVersion": { "type": "string" },
                  "providerId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "providerTypeId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "status":
                    {
                      "enum": ["draft", "active", "degraded", "disabled", "retired"],
                      "type": "string",
                    },
                  "updatedAt": { "format": "date-time", "type": "string" },
                },
              "required": ["providerId", "providerTypeId", "hostingMode", "status"],
              "type": "object",
            },
          "ProviderPackage":
            {
              "additionalProperties": false,
              "properties":
                {
                  "compatibleRuntimeVersion": { "type": "string" },
                  "configSchemaId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "hostingModes":
                    {
                      "items": { "enum": ["vendor_managed", "platform_managed"], "type": "string" },
                      "type": "array",
                    },
                  "packageId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "packageVersion": { "maxLength": 64, "minLength": 1, "type": "string" },
                  "protocolMode": { "type": "string" },
                  "providerType": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "qualification":
                    {
                      "additionalProperties": false,
                      "properties":
                        {
                          "componentStatus":
                            {
                              "enum": ["passed", "partial", "pending", "failed"],
                              "type": "string",
                            },
                          "realResourceStatus":
                            {
                              "enum": ["qualified", "pending", "failed", "not_applicable"],
                              "type": "string",
                            },
                        },
                      "required": ["componentStatus", "realResourceStatus"],
                      "type": "object",
                    },
                },
              "required":
                [
                  "packageId",
                  "packageVersion",
                  "providerType",
                  "hostingModes",
                  "configSchemaId",
                  "compatibleRuntimeVersion",
                  "protocolMode",
                  "qualification",
                ],
              "type": "object",
            },
          "ProviderResourceBinding":
            {
              "additionalProperties": false,
              "properties":
                {
                  "boundAt": { "format": "date-time", "type": "string" },
                  "environment": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "providerId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "resourceId": { "maxLength": 128, "minLength": 1, "type": "string" },
                },
              "required": ["providerId", "environment", "resourceId", "boundAt"],
              "type": "object",
            },
          "ProviderType":
            {
              "additionalProperties": false,
              "properties":
                {
                  "displayName": { "maxLength": 256, "minLength": 1, "type": "string" },
                  "providerTypeId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "status": { "enum": ["active", "deprecated"], "type": "string" },
                  "updatedAt": { "format": "date-time", "type": "string" },
                },
              "required": ["providerTypeId", "displayName", "status"],
              "type": "object",
            },
          "RegistryDiff":
            {
              "additionalProperties": false,
              "properties":
                {
                  "added":
                    {
                      "items": { "$ref": "#/components/schemas/RegistryProviderProjection" },
                      "type": "array",
                    },
                  "changed":
                    {
                      "items": { "$ref": "#/components/schemas/RegistryProviderChange" },
                      "type": "array",
                    },
                  "environment": { "pattern": "^[a-z][a-z0-9-]{0,62}$", "type": "string" },
                  "fromRevision": { "minimum": 1, "type": "integer" },
                  "removed":
                    {
                      "items": { "$ref": "#/components/schemas/RegistryProviderProjection" },
                      "type": "array",
                    },
                  "toRevision": { "minimum": 1, "type": "integer" },
                },
              "required":
                ["environment", "fromRevision", "toRevision", "added", "removed", "changed"],
              "type": "object",
            },
          "RegistryProviderChange":
            {
              "additionalProperties": false,
              "properties":
                {
                  "after": { "$ref": "#/components/schemas/RegistryProviderProjection" },
                  "before": { "$ref": "#/components/schemas/RegistryProviderProjection" },
                  "providerId": { "maxLength": 128, "minLength": 1, "type": "string" },
                },
              "required": ["providerId"],
              "type": "object",
            },
          "RegistryProviderProjection":
            {
              "additionalProperties": false,
              "properties":
                {
                  "catalogRevision": { "minimum": 1, "type": "integer" },
                  "effectiveEndpoint": { "minLength": 1, "type": "string" },
                  "protocolMode": { "const": "frozen_v1", "type": "string" },
                  "providerId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "serverId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "tools":
                    {
                      "items": { "additionalProperties": true, "type": "object" },
                      "type": "array",
                    },
                },
              "required":
                [
                  "providerId",
                  "serverId",
                  "protocolMode",
                  "effectiveEndpoint",
                  "catalogRevision",
                  "tools",
                ],
              "type": "object",
            },
          "RegistrySnapshot":
            {
              "additionalProperties": false,
              "properties":
                {
                  "checksum": { "pattern": "^[0-9a-f]{64}$", "type": "string" },
                  "createdAt": { "format": "date-time", "type": "string" },
                  "document": { "$ref": "#/components/schemas/RegistrySnapshotDocument" },
                  "environment": { "pattern": "^[a-z][a-z0-9-]{0,62}$", "type": "string" },
                  "publishedAt": { "format": "date-time", "type": "string" },
                  "revision": { "minimum": 1, "type": "integer" },
                },
              "required":
                ["environment", "revision", "checksum", "document", "publishedAt", "createdAt"],
              "type": "object",
            },
          "RegistrySnapshotDocument":
            {
              "additionalProperties": false,
              "properties":
                {
                  "environment": { "pattern": "^[a-z][a-z0-9-]{0,62}$", "type": "string" },
                  "providers":
                    {
                      "items": { "$ref": "#/components/schemas/RegistryProviderProjection" },
                      "type": "array",
                    },
                },
              "required": ["environment", "providers"],
              "type": "object",
            },
          "Resource":
            {
              "additionalProperties": false,
              "properties":
                {
                  "environment": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "metadata": { "additionalProperties": true, "type": "object" },
                  "resourceId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "resourceType": { "type": "string" },
                  "status": { "enum": ["available", "unavailable", "retired"], "type": "string" },
                  "updatedAt": { "format": "date-time", "type": "string" },
                },
              "required": ["environment", "resourceId", "resourceType", "metadata", "status"],
              "type": "object",
            },
          "RuntimeDeployment":
            {
              "additionalProperties": false,
              "properties":
                {
                  "adapterEndpoint": { "type": "string" },
                  "configProfileId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "databaseProfileId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "deploymentId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "desiredReplicas": { "maximum": 1, "minimum": 0, "type": "integer" },
                  "desiredRevision": { "minimum": 0, "type": "integer" },
                  "desiredState": { "enum": ["running", "draining"], "type": "string" },
                  "environment": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "observedRevision": { "minimum": 0, "type": "integer" },
                  "providerId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "runtimeVersion": { "type": "string" },
                  "status":
                    {
                      "enum":
                        [
                          "REQUESTED",
                          "DATABASE_PROVISIONING",
                          "MIGRATING",
                          "CONFIG_PREPARING",
                          "STARTING",
                          "HEALTH_CHECKING",
                          "DISCOVERING",
                          "ACTIVE",
                          "STOPPED",
                          "DRAINING",
                          "DEGRADED",
                          "FAILED",
                        ],
                      "type": "string",
                    },
                },
              "required":
                [
                  "deploymentId",
                  "providerId",
                  "environment",
                  "desiredState",
                  "desiredReplicas",
                  "runtimeVersion",
                  "databaseProfileId",
                  "configProfileId",
                  "status",
                  "desiredRevision",
                  "observedRevision",
                ],
              "type": "object",
            },
          "RuntimeDeploymentIntent":
            {
              "additionalProperties": false,
              "description": "operationId is the existing correlation identifier returned by the current route; it is not a Generic Operation domain object.",
              "properties":
                {
                  "deployment": { "$ref": "#/components/schemas/RuntimeDeployment" },
                  "operationId": { "type": "string" },
                },
              "required": ["operationId", "deployment"],
              "type": "object",
            },
          "RuntimeProcess":
            {
              "additionalProperties": true,
              "description": "Read-only projection from RuntimeProcessQueryService. Direct process control is forbidden.",
              "properties":
                {
                  "catalogState": { "type": "string" },
                  "configRevision": { "type": ["integer", "null"] },
                  "deploymentId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "healthReasonCode": { "type": "string" },
                  "instanceId": { "maxLength": 128, "minLength": 1, "type": "string" },
                  "lastHeartbeatAt": { "format": "date-time", "type": ["string", "null"] },
                  "livenessState": { "type": "string" },
                  "logReference":
                    { "$ref": "#/components/schemas/RuntimeProcessLogReference", "readOnly": true },
                  "observedHealth":
                    {
                      "enum":
                        [
                          "STOPPED",
                          "STARTING",
                          "NOT_READY",
                          "STALE",
                          "DEGRADED",
                          "FAILED",
                          "READY",
                        ],
                      "type": "string",
                    },
                  "observedRevision": { "type": "integer" },
                  "processState":
                    {
                      "enum": ["missing", "starting", "online", "stopping", "stopped", "errored"],
                      "type": "string",
                    },
                  "readinessState": { "type": "string" },
                  "readyForActive": { "type": "boolean" },
                  "registrationFreshness":
                    {
                      "enum": ["unregistered", "registered", "stale", "identity_mismatch"],
                      "type": "string",
                    },
                  "registrationState": { "type": "string" },
                  "restartCount": { "minimum": 0, "type": "integer" },
                  "runtimeVersion": { "type": "string" },
                  "stale": { "type": "boolean" },
                },
              "required":
                [
                  "instanceId",
                  "deploymentId",
                  "processState",
                  "observedHealth",
                  "readyForActive",
                  "stale",
                  "registrationFreshness",
                  "logReference",
                ],
              "type": "object",
            },
          "RuntimeProcessLogReference":
            {
              "additionalProperties": false,
              "description": "Opaque log locator emitted by the existing RuntimeProcess query. V1 does not guarantee that tailEndpoint is dereferenceable through the Console API.",
              "properties":
                {
                  "contentIncluded": { "const": false, "type": "boolean" },
                  "referenceId": { "type": "string" },
                  "tailEndpoint": { "type": "string" },
                },
              "required": ["referenceId", "tailEndpoint", "contentIncluded"],
              "type": "object",
            },
          "SecretRef":
            {
              "additionalProperties": false,
              "properties": { "secretRef": { "minLength": 1, "type": "string" } },
              "required": ["secretRef"],
              "type": "object",
            },
        },
    },
  "info":
    {
      "description": "Contract Candidate 2. Transport adapter contract only; no /api/console/v1 implementation is included. Authentication, authorization, RBAC, login and session management are explicitly deferred. X-Actor-ID is audit metadata rather than an authentication credential.",
      "title": "PMS Console API Contract",
      "version": "1.0.0-candidate.2",
    },
  "openapi": "3.1.0",
  "paths":
    {
      "/audit-events":
        {
          "get":
            {
              "description": "Console transport projection of existing SMPP capability `listAuditEvents`.",
              "operationId": "listAuditEvents",
              "parameters":
                [
                  {
                    "in": "query",
                    "name": "subjectType",
                    "required": false,
                    "schema": { "maxLength": 128, "minLength": 1, "type": "string" },
                  },
                  {
                    "in": "query",
                    "name": "subjectId",
                    "required": false,
                    "schema": { "maxLength": 128, "minLength": 1, "type": "string" },
                  },
                  {
                    "in": "query",
                    "name": "correlationId",
                    "required": false,
                    "schema": { "maxLength": 128, "minLength": 1, "type": "string" },
                  },
