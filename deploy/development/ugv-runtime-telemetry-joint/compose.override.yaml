services:
  ugv-adapter:
    environment:
      UGV_DELIVERY_STAGE: ${UGV_DELIVERY_STAGE:-development_debug}
      UGV_EXECUTION_MODE: ${UGV_EXECUTION_MODE:-live}
      UGV_DEVICE_MCP_URL: ${UGV_SIM_DEVICE_MCP_URL:-http://192.168.2.63:19000/mcp}
      UGV_MQTT_URL: ${UGV_SIM_MQTT_URL:-mqtt://192.168.2.63:1883}
      UGV_MQTT_WIRE_MODE: ${UGV_MQTT_WIRE_MODE:-ros_bridge_json}
      UGV_FIRE_ENABLED: ${UGV_FIRE_ENABLED:-true}
      RUNTIME_ENV: development

  ugv-runtime:
    environment:
      RUNTIME_ENV: development
      ALLOW_INSECURE_INTERNAL_TRANSPORT: "true"
      RUNTIME_DEPLOYMENT_ID: ${UGV_RUNTIME_DEPLOYMENT_ID:-ugv-test-deployment}
      RUNTIME_INSTANCE_ID: ${UGV_RUNTIME_INSTANCE_ID:-ugv-runtime-test-1}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UGV_RUNTIME_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_TLS_MODE: disabled
      OTEL_EXPORTER_OTLP_TIMEOUT_MS: "10000"
      OTEL_SERVICE_INSTANCE_ID: ${UGV_RUNTIME_INSTANCE_ID:-ugv-runtime-test-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
