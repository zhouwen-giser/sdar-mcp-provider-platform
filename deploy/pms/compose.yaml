services:
  pms-api:
    image: sdar/pms-api:0.1.0-rc
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=1000,gid=1000
    environment:
      PMS_API_HOST: 0.0.0.0
      PMS_API_PORT: "8090"
      PMS_DATABASE_URL_FILE: /run/secrets/pms-database-url
      PMS_MANAGEMENT_CREDENTIAL_FILE: /run/secrets/pms-management-credentials
      PMS_RUNTIME_CREDENTIAL_FILE: /run/secrets/pms-runtime-credentials
    secrets:
      - pms-database-url
      - pms-management-credentials
      - pms-runtime-credentials
    ports:
      - "8090:8090"
    restart: unless-stopped

  pms-worker:
    image: sdar/pms-worker:0.1.0-rc
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=1000,gid=1000
    environment:
      PMS_DATABASE_URL_FILE: /run/secrets/pms-database-url
      PMS_POSTGRES_PROVISIONING_CREDENTIAL_FILE: /run/secrets/pms-postgres-provisioning
      PMS_RUNTIME_RELEASE_ROOT: /opt/sdar/runtime-releases
      PMS_RUNTIME_SECRET_ROOT: /var/lib/sdar/runtime-secrets
      PMS_RUNTIME_CONFIG_CACHE_ROOT: /var/lib/sdar/runtime-cache
      PMS_RUNTIME_CONTROL_PLANE_URL: http://pms-api:8090
      PMS_RUNTIME_CONTROL_PLANE_CREDENTIAL_ROOT: /run/secrets/runtime-control-plane
      PMS_PM2_HOME: /var/lib/sdar/pm2
      PMS_RUNTIME_RECONCILE_INTERVAL_MS: "5000"
      PMS_RUNTIME_RECONCILE_TIMEOUT_MS: "30000"
      PMS_RUNTIME_HEALTH_TIMEOUT_MS: "3000"
    secrets:
      - pms-database-url
      - pms-postgres-provisioning
    volumes:
      - type: bind
        source: ./runtime-control-plane
        target: /run/secrets/runtime-control-plane
        read_only: true
      - type: bind
        source: ./runtime-releases
        target: /opt/sdar/runtime-releases
        read_only: true
      - worker-state:/var/lib/sdar
    depends_on:
      pms-api:
        condition: service_healthy
    restart: unless-stopped

  pms-web:
    image: sdar/pms-web:0.1.0-rc
    user: "1000:1000"
    read_only: true
    environment:
      PMS_WEB_API_BASE: http://localhost:8090
      PMS_WEB_HOST: 0.0.0.0
      PMS_WEB_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      pms-api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  pms-database-url:
    file: ./secrets/pms-database-url
  pms-management-credentials:
    file: ./secrets/pms-management-credentials.json
  pms-runtime-credentials:
    file: ./secrets/pms-runtime-credentials.json
  pms-postgres-provisioning:
    file: ./secrets/pms-postgres-provisioning.json

volumes:
  worker-state:
