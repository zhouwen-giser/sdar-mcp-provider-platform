# Native ZMQ uses the verified host-network path; PMS retains its original Docker DNS endpoint.
services:
  pms-gateway:
    container_name: ${SITE_RUNTIME_CONTAINER_NAME:?preserved PMS logical instance name}
    image: ${SITE_RUNTIME_IMAGE:?pin the verified Runtime image}
    init: true
    read_only: true
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:${SITE_HOST_GATEWAY_IP:?existing Runtime network gateway}"]
    entrypoint: ["node", "--input-type=module", "-e"]
    command:
      - |
        import net from 'node:net';
        const server = net.createServer((client) => {
          const upstream = net.connect({ host: 'host.docker.internal', port: 19100 });
          const close = () => { client.destroy(); upstream.destroy(); };
          upstream.setTimeout(5000, () => { if (upstream.connecting) close(); });
          upstream.on('connect', () => upstream.setTimeout(0));
          client.on('error', close); upstream.on('error', close);
          client.on('close', () => upstream.destroy()); upstream.on('close', () => client.destroy());
          client.pipe(upstream).pipe(client);
        });
        server.listen(8080, '0.0.0.0', () => console.log('pms_runtime_gateway_ready'));
        process.once('SIGTERM', () => server.close(() => process.exit(0)));
    networks:
      runtime_network:
        aliases: ["${SITE_RUNTIME_CONTAINER_NAME}"]
      owner_network:
        aliases: ["${SITE_RUNTIME_CONTAINER_NAME}"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  runtime:
    image: ${SITE_RUNTIME_IMAGE:?pin the verified Runtime image}
    network_mode: host
    init: true
    read_only: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    env_file: ${SITE_RUNTIME_ENV:?formal private Runtime environment}
    extra_hosts:
      - "adapter:127.0.0.1"
      - "pms-api:${SITE_PMS_API_ADDRESS:?preserved actual PMS API address}"
    volumes:
      - ${SITE_GOWM_URL_FILE:?existing restricted owner URL}:/run/secrets/gowm.url:ro
      - ${SITE_RUNTIME_CONFIG_DIR:?preserved PMS token directory}:/run/config:ro
      - ${SITE_RUNTIME_DATA_DIR:?preserved trajectory signing keys}:/var/lib/sdar
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  provider:
    image: ${SITE_PROVIDER_IMAGE:?pin the verified Provider image}
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    env_file: ${SITE_PROVIDER_ENV:?formal private owner environment}
    environment:
      UGV_ZMQ_PROVIDER_CONFIG_FILE: /run/secrets/provider.json
    volumes:
      - ${SITE_PROVIDER_CONFIG:?formal configuration with port 7010}:/run/secrets/provider.json:ro
      - ${SITE_GOWM_URL_FILE:?existing restricted owner URL}:/run/secrets/gowm.url:ro
      - ${SITE_HANDOFF_GRANT_FILE:?verified handoff grant}:/run/secrets/handoff.json:ro
      - ${SITE_JWT_SECRET_FILE:?server management JWT secret}:/run/secrets/site-jwt.key:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  console:
    image: ${SITE_CONSOLE_IMAGE:?pin the verified console image}
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    env_file: ${SITE_CONSOLE_ENV:?formal private console environment}
    volumes:
      - ${SITE_CONSOLE_DATABASE_URL_FILE:?preserved console database URL}:/run/secrets/console-database.url:ro
      - ${SITE_CONSOLE_CREDENTIALS_FILE:?preserved operator credentials}:/run/secrets/credentials.json:ro
      - ${SITE_CONSOLE_AUTHORIZATION_FILE:?server-only signed bearer token}:/run/secrets/upstream-authorization:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  runtime_network:
    external: true
    name: ${SITE_EXISTING_RUNTIME_NETWORK:?preserved Runtime/PMS network}
  owner_network:
    external: true
    name: ${SITE_EXISTING_OWNER_NETWORK:?preserved GOWM owner network}
