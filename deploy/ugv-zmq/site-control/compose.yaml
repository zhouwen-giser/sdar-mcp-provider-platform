services:
  provider:
    image: ${SITE_PROVIDER_IMAGE:?pin the verified Provider image}
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    env_file: ${SITE_PROVIDER_ENV:?private owner environment}
    environment:
      UGV_ZMQ_PROVIDER_CONFIG_FILE: /run/secrets/provider.json
    volumes:
      - ${SITE_PROVIDER_CONFIG:?private site_control configuration}:/run/secrets/provider.json:ro
      - ${SITE_GOWM_URL_FILE:?existing restricted owner URL}:/run/secrets/gowm.url:ro
      - ${SITE_HANDOFF_GRANT_FILE:?verified handoff grant}:/run/secrets/handoff.json:ro
      - ${SITE_JWT_SECRET_FILE:?server management JWT secret}:/run/secrets/site-jwt.key:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  runtime:
    image: ${SITE_RUNTIME_IMAGE:?pin the verified Runtime image}
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    env_file: ${SITE_RUNTIME_ENV:?private Runtime environment}
    volumes:
      - ${SITE_GOWM_URL_FILE:?existing restricted owner URL}:/run/secrets/gowm.url:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  console:
    image: ${SITE_CONSOLE_IMAGE:?pin the verified console image}
    network_mode: host
    read_only: true
    init: true
    restart: unless-stopped
    env_file: ${SITE_CONSOLE_ENV:?private console environment}
    volumes:
      - ${SITE_CONSOLE_DATABASE_URL_FILE:?preserved console database URL}:/run/secrets/console-database.url:ro
      - ${SITE_CONSOLE_CREDENTIALS_FILE:?preserved operator credentials}:/run/secrets/credentials.json:ro
      - ${SITE_CONSOLE_AUTHORIZATION_FILE:?server-only signed bearer token}:/run/secrets/upstream-authorization:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
