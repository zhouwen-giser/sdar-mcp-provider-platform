name: sdar-production-ugv

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  pms-postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 256
    mem_limit: 512m
    logging: *json-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms_admin
      POSTGRES_DB: pms
      POSTGRES_PASSWORD_FILE: /run/secrets/pms_postgres_password
    secrets:
      - pms_postgres_password
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_admin -d pms"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - pms-database
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  pms-api:
    image: sdar/production-ugv-pms-api:${BUNDLE_REVISION:?BUNDLE_REVISION must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 256
    mem_limit: 512m
    logging: *json-logging
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      ALLOW_INSECURE_INTERNAL_TRANSPORT: ${ALLOW_INSECURE_INTERNAL_TRANSPORT:?ALLOW_INSECURE_INTERNAL_TRANSPORT must be explicitly true}
      PMS_API_HOST: 0.0.0.0
      PMS_API_PORT: "8090"
      PMS_API_MANAGEMENT_AUTH_MODE: anonymous_intranet
      PMS_DATABASE_URL_FILE: /run/pms-secrets/pms-database-url
      PMS_RUNTIME_CREDENTIAL_FILE: /run/pms-secrets/api/runtime.json
    expose:
      - "8090"
    volumes:
      - type: bind
        source: ./secrets/pms/pms-database-url
        target: /run/pms-secrets/pms-database-url
        read_only: true
      - type: bind
        source: ./secrets/pms/api/runtime.json
        target: /run/pms-secrets/api/runtime.json
        read_only: true
      - type: bind
        source: ./secrets/pms/runtime-control-plane
        target: /run/pms-secrets/runtime-control-plane
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      pms-postgres:
        condition: service_healthy
    networks:
      - pms-database
      - pms-control
      - ugv-service
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  pms-worker:
    image: sdar/production-ugv-pms-worker:${BUNDLE_REVISION:?BUNDLE_REVISION must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 512
    mem_limit: 1g
    logging: *json-logging
    init: true
    read_only: true
    restart: unless-stopped
    network_mode: service:pms-api
    environment:
      ALLOW_INSECURE_INTERNAL_TRANSPORT: ${ALLOW_INSECURE_INTERNAL_TRANSPORT:?ALLOW_INSECURE_INTERNAL_TRANSPORT must be explicitly true}
      PMS_EXTERNAL_RUNTIME_CATALOG_AUTH_MODE: anonymous_intranet
      PMS_DATABASE_URL_FILE: /run/pms-secrets/pms-database-url
      PMS_WORKER_ID: production-ugv-worker
      PMS_WORKER_POLL_INTERVAL_MS: "1000"
      PMS_WORKER_LEASE_DURATION_MS: "30000"
      PMS_WORKER_CLAIM_LIMIT: "10"
      PMS_WORKER_RETRY_DELAY_MS: "5000"
      PMS_WORKSPACE_ROOT: /app
      PMS_POSTGRES_PROVISIONING_CREDENTIAL_FILE: /run/pms-secrets/worker/postgres-provisioning.json
      PMS_RUNTIME_RELEASE_ROOT: /app/runtime-releases
      PMS_RUNTIME_SECRET_ROOT: /var/lib/sdar/runtime-secrets
      PMS_RUNTIME_CONFIG_CACHE_ROOT: /var/lib/sdar/runtime-cache
      PMS_RUNTIME_CONTROL_PLANE_URL: http://pms-api:8090
      PMS_RUNTIME_CONTROL_PLANE_CREDENTIAL_ROOT: /var/lib/sdar/runtime-control-plane
      PMS_PM2_HOME: /var/lib/sdar/pm2
      PMS_RUNTIME_RECONCILE_INTERVAL_MS: "5000"
      PMS_RUNTIME_RECONCILE_TIMEOUT_MS: "30000"
      PMS_RUNTIME_HEALTH_TIMEOUT_MS: "3000"
    volumes:
      - type: bind
        source: ./secrets/pms/pms-database-url
        target: /run/pms-secrets/pms-database-url
        read_only: true
      - type: bind
        source: ./secrets/pms/worker
        target: /run/pms-secrets/worker
        read_only: true
      - type: bind
        source: ./runtime/pms-worker-state
        target: /var/lib/sdar
      - type: bind
        source: ./secrets/pms/runtime-control-plane
        target: /var/lib/sdar/runtime-control-plane
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "try{process.kill(1,0)}catch{process.exit(1)}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      pms-postgres:
        condition: service_healthy
      pms-api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s

  pms-web:
    image: sdar/production-pms-web:${BUNDLE_REVISION:?BUNDLE_REVISION must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 128
    mem_limit: 256m
    logging: *json-logging
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      PMS_WEB_DATA_MODE: api
      PMS_WEB_API_BASE: /api/console/v1
      PMS_WEB_API_UPSTREAM: http://pms-api:8090
      PMS_WEB_HOST: 0.0.0.0
      PMS_WEB_PORT: "8080"
      PMS_WEB_PROXY_MAX_BODY_BYTES: ${PMS_WEB_PROXY_MAX_BODY_BYTES:-1048576}
      PMS_WEB_PROXY_TIMEOUT_MS: ${PMS_WEB_PROXY_TIMEOUT_MS:-10000}
      PMS_WEB_RAW_API_PROXY_ENABLED: "true"
    ports:
      - "${PMS_WEB_BIND_ADDRESS:-0.0.0.0}:${PMS_WEB_PORT:-8088}:8080"
    volumes:
      - type: bind
        source: ./bin/pms-web-smoke.mjs
        target: /opt/sdar-bundle/pms-web-smoke.mjs
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      pms-api:
        condition: service_healthy
    networks:
      - pms-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  ugv-adapter-postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 256
    mem_limit: 512m
    logging: *json-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ugv_adapter
      POSTGRES_DB: ugv_adapter
      POSTGRES_PASSWORD_FILE: /run/secrets/ugv_adapter_postgres_password
    secrets:
      - ugv_adapter_postgres_password
    volumes:
      - ugv-adapter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugv_adapter -d ugv_adapter"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - ugv-database
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  ugv-runtime-postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 256
    mem_limit: 1g
    logging: *json-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ugv_runtime
      POSTGRES_DB: ugv_runtime
      POSTGRES_PASSWORD_FILE: /run/secrets/ugv_runtime_postgres_password
    secrets:
      - ugv_runtime_postgres_password
    volumes:
      - ugv-runtime-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugv_runtime -d ugv_runtime"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - ugv-database
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  ugv-adapter:
    image: sdar/production-ugv-adapter:${BUNDLE_REVISION:?BUNDLE_REVISION must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 256
    mem_limit: 768m
    logging: *json-logging
    init: true
    read_only: true
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        export UGV_ADAPTER_DATABASE_URL="$$(cat /run/secrets/ugv_adapter_database_url)"
        node dist/apps/ugv-provider-adapter/src/migrate.js
        exec node dist/apps/ugv-provider-adapter/src/main.js
    environment:
      RUNTIME_ENV: production
      ALLOW_INSECURE_INTERNAL_TRANSPORT: ${ALLOW_INSECURE_INTERNAL_TRANSPORT:?ALLOW_INSECURE_INTERNAL_TRANSPORT must be explicitly true}
      PROVIDER_ID: isr.vehicle.ugv.ugv1
      PROVIDER_VERSION: 1.0.0
      ADAPTER_HOST: 0.0.0.0
      ADAPTER_PORT: "7010"
      ADAPTER_TLS_MODE: disabled
      UGV_ADAPTER_STORE_MODE: postgres
      UGV_ADAPTER_DATABASE_POOL_MAX: ${UGV_ADAPTER_DATABASE_POOL_MAX:-8}
      UGV_MQTT_URL: ${UGV_SIM_MQTT_URL:?UGV_SIM_MQTT_URL is required}
      UGV_MQTT_CLIENT_ID: ${UGV_SIM_MQTT_CLIENT_ID:-sdar-production-ugv-adapter-ugv1}
      UGV_MQTT_TLS_MODE: disabled
      UGV_MQTT_SESSION_MODE: persistent
      UGV_MQTT_WIRE_MODE: ${UGV_MQTT_WIRE_MODE:?UGV_MQTT_WIRE_MODE is required}
      UGV_MQTT_RECONNECT_MIN_MS: ${UGV_MQTT_RECONNECT_MIN_MS:-500}
      UGV_MQTT_RECONNECT_MAX_MS: ${UGV_MQTT_RECONNECT_MAX_MS:-30000}
      UGV_CHASSIS_FRESHNESS_MS: ${UGV_CHASSIS_FRESHNESS_MS:-3000}
      UGV_MISSION_FRESHNESS_MS: ${UGV_MISSION_FRESHNESS_MS:-3000}
      UGV_HEALTH_FRESHNESS_MS: ${UGV_HEALTH_FRESHNESS_MS:-5000}
      UGV_TARGET_FRESHNESS_MS: ${UGV_TARGET_FRESHNESS_MS:-3000}
      UGV_PAYLOAD_FRESHNESS_MS: ${UGV_PAYLOAD_FRESHNESS_MS:-3000}
      UGV_DEVICE_MCP_URL: ${UGV_SIM_DEVICE_MCP_URL:?UGV_SIM_DEVICE_MCP_URL is required}
      UGV_DEVICE_MCP_TLS_MODE: disabled
      UGV_DEVICE_MCP_TIMEOUT_MS: ${UGV_SIM_DEVICE_MCP_TIMEOUT_MS:-10000}
      UGV_DEVICE_MCP_ALLOW_MOCK_CONTRACT: "false"
      UGV_DEVICE_MCP_CONTRACT_REPORT_PATH: /var/lib/sdar/contracts/MCP_CONTRACT_CAPTURE.json
      PROVIDER_TELEMETRY_ENABLED: "true"
      PROVIDER_TELEMETRY_ENDPOINT: ugv-runtime:7002
      PROVIDER_TELEMETRY_TLS_MODE: disabled
      LOG_LEVEL: ${UGV_LOG_LEVEL:-info}
    expose:
      - "7010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ugv-adapter-postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./runtime/ugv-contract-reports
        target: /var/lib/sdar
    secrets:
      - ugv_adapter_database_url
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const n=require('node:net').connect(7010,'127.0.0.1');n.setTimeout(2000);n.once('connect',()=>{n.end();process.exit(0)});n.once('timeout',()=>process.exit(1));n.once('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - ugv-database
      - ugv-service
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  ugv-runtime:
    image: sdar/production-ugv-runtime:${BUNDLE_REVISION:?BUNDLE_REVISION must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 384
    mem_limit: 1g
    logging: *json-logging
    init: true
    read_only: true
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        node dist/apps/runtime/src/migrate.js
        exec node dist/apps/runtime/src/main.js
    environment:
      RUNTIME_ENV: production
      ALLOW_INSECURE_INTERNAL_TRANSPORT: ${ALLOW_INSECURE_INTERNAL_TRANSPORT:?ALLOW_INSECURE_INTERNAL_TRANSPORT must be explicitly true}
      HOST: 0.0.0.0
      PORT: "8080"
      PROVIDER_ID: isr.vehicle.ugv.ugv1
      DATABASE_URL_FILE: /run/secrets/ugv_runtime_database_url
      DATABASE_POOL_MAX: ${UGV_RUNTIME_DATABASE_POOL_MAX:-10}
      ADAPTER_ENDPOINT: ugv-adapter:7010
      ADAPTER_TLS_MODE: disabled
      AUTH_MODE: anonymous
      PMS_DEPLOYMENT_ID: production-ugv-direct
      PMS_INSTANCE_ID: production-ugv-direct-1
      PMS_RUNTIME_REGISTRATION_URL: http://pms-api:8090
      PMS_RUNTIME_REGISTRATION_TOKEN_FILE: /run/secrets/pms-runtime-control-plane.token
      PMS_RUNTIME_HEARTBEAT_INTERVAL_MS: "10000"
      UGV_SMOKE_MAX_STATE_AGE_MS: ${UGV_SMOKE_MAX_STATE_AGE_MS:-30000}
      MCP_LEGACY_ENDPOINT_ENABLED: "false"
      ALLOW_WEAK_LEASE_CONFIGURATION: "false"
      INTERNAL_ENDPOINTS_ENABLED: "false"
      BUSINESS_EVENTS_ENABLED: "true"
      BUSINESS_EVENTS_REQUIRED_FOR_RUNTIME_READY: "true"
      PROVIDER_TELEMETRY_INGRESS_ENABLED: "true"
      PROVIDER_TELEMETRY_HOST: 0.0.0.0
      PROVIDER_TELEMETRY_PORT: "7002"
      PROVIDER_TELEMETRY_TLS_MODE: disabled
      OTEL_ENABLED: ${UGV_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UGV_OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4318}
      OTEL_EXPORTER_OTLP_TLS_MODE: disabled
      OTEL_EXPORTER_OTLP_TIMEOUT_MS: ${UGV_OTEL_EXPORTER_OTLP_TIMEOUT_MS:-10000}
      OTEL_SERVICE_INSTANCE_ID: production-ugv-direct-1
      LOG_LEVEL: ${UGV_LOG_LEVEL:-info}
    ports:
      - "${UGV_RUNTIME_BIND_ADDRESS:-0.0.0.0}:${UGV_RUNTIME_PORT:-19100}:8080"
    expose:
      - "7002"
    depends_on:
      ugv-runtime-postgres:
        condition: service_healthy
      ugv-adapter:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./secrets/pms/runtime-control-plane/providers/isr.vehicle.ugv.ugv1/deployments/production-ugv-direct/instances/production-ugv-direct-1/control-plane.token
        target: /run/secrets/pms-runtime-control-plane.token
        read_only: true
    secrets:
      - ugv_runtime_database_url
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks:
      - ugv-database
      - ugv-service
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  pms-seed:
    profiles: ["seed"]
    image: sdar/production-ugv-pms-worker:${BUNDLE_REVISION:?BUNDLE_REVISION must come from .bundle-images.env}
    pull_policy: never
    pids_limit: 128
    mem_limit: 512m
    logging: *json-logging
    init: true
    read_only: true
    restart: "no"
    command: ["node", "/app/pms-seed.mjs"]
    environment:
      PMS_SEED_API_BASE_URL: http://pms-api:8090
      PMS_SEED_ACTOR_ID: production-ugv-admin
      PMS_SEED_ENVIRONMENT: production
      PMS_SEED_PROVIDER_ID: isr.vehicle.ugv.ugv1
      PMS_SEED_ADAPTER_ENDPOINT: ugv-adapter:7010
      PMS_SEED_DEPLOYMENT_ID: production-ugv-direct
      PMS_SEED_INSTANCE_ID: production-ugv-direct-1
      PMS_SEED_RUNTIME_VERSION: 2.0.0-rc.1
      PMS_SEED_RUNTIME_CONTROL_ENDPOINT: http://ugv-runtime:8080
      PMS_SEED_RUNTIME_ADVERTISED_ENDPOINT: ${UGV_RUNTIME_ADVERTISED_URL:?UGV_RUNTIME_ADVERTISED_URL is required}
      PMS_SEED_RUNTIME_PUBLISHED_PORT: ${UGV_RUNTIME_PORT:-19100}
      PMS_SEED_WAIT_TIMEOUT_MS: ${UGV_PMS_AUTHORITY_WAIT_TIMEOUT_MS:-180000}
      PMS_SEED_POLL_INTERVAL_MS: ${UGV_PMS_AUTHORITY_POLL_INTERVAL_MS:-2000}
      PMS_SMOKE_API_BASE_URL: http://pms-api:8090
      PMS_SEED_DATABASE_URL_FILE: /run/pms-secrets/pms-database-url
      PMS_SEED_PACKAGE_ROOT: /app
    volumes:
      - type: bind
        source: ./bin/pms-seed.mjs
        target: /app/pms-seed.mjs
        read_only: true
      - type: bind
        source: ./bin/runtime-smoke.mjs
        target: /app/runtime-smoke.mjs
        read_only: true
      - type: bind
        source: ./secrets/pms/pms-database-url
        target: /run/pms-secrets/pms-database-url
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=1000,gid=1000
    depends_on:
      pms-api:
        condition: service_healthy
      pms-worker:
        condition: service_healthy
    networks:
      - pms-database
      - pms-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  pms-database:
    driver: bridge
    internal: true
  pms-control:
    driver: bridge
  ugv-database:
    driver: bridge
    internal: true
  ugv-service:
    driver: bridge

volumes:
  pms-postgres-data:
  ugv-adapter-postgres-data:
  ugv-runtime-postgres-data:

secrets:
  pms_postgres_password:
    file: ./secrets/pms/postgres-password
  ugv_adapter_postgres_password:
    file: ./secrets/ugv/database/adapter-password
  ugv_runtime_postgres_password:
    file: ./secrets/ugv/database/runtime-password
  ugv_adapter_database_url:
    file: ./secrets/ugv/database/adapter-database-url
  ugv_runtime_database_url:
    file: ./secrets/ugv/database/runtime-database-url
