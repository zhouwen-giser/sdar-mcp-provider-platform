name: sdar-pms-console

services:
  pms-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms_admin
      POSTGRES_DB: pms
      POSTGRES_PASSWORD_FILE: /run/secrets/pms_postgres_password
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
    secrets:
      - pms_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_admin -d pms"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - pms-console
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  pms-api:
    image: sdar/pms-api:${PMS_CONSOLE_GIT_SHA:-unverified}
    build:
      context: ${PMS_CONSOLE_BUILD_CONTEXT:-../..}
      dockerfile: Dockerfile
      target: pms-api
      args:
        VCS_REF: ${PMS_CONSOLE_GIT_SHA:-unverified}
        VITE_PMS_DATA_MODE: api
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      PMS_API_HOST: 0.0.0.0
      PMS_API_PORT: "8090"
      PMS_DATABASE_URL_FILE: /run/pms-secrets/pms-database-url
      PMS_MANAGEMENT_CREDENTIAL_FILE: /run/pms-secrets/api/management.json
      PMS_RUNTIME_CREDENTIAL_FILE: /run/pms-secrets/api/runtime.json
    expose:
      - "8090"
    volumes:
      - type: bind
        source: ${PMS_CONSOLE_SECRET_ROOT:?PMS_CONSOLE_SECRET_ROOT is required}/pms-database-url
        target: /run/pms-secrets/pms-database-url
        read_only: true
      - type: bind
        source: ${PMS_CONSOLE_SECRET_ROOT:?PMS_CONSOLE_SECRET_ROOT is required}/api
        target: /run/pms-secrets/api
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      pms-postgres:
        condition: service_healthy
    networks:
      - pms-console
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  pms-worker:
    image: sdar/pms-worker:${PMS_CONSOLE_GIT_SHA:-unverified}
    build:
      context: ${PMS_CONSOLE_BUILD_CONTEXT:-../..}
      dockerfile: Dockerfile
      target: pms-worker
      args:
        VCS_REF: ${PMS_CONSOLE_GIT_SHA:-unverified}
        VITE_PMS_DATA_MODE: api
    init: true
    read_only: true
    restart: unless-stopped
    network_mode: service:pms-api
    environment:
      PMS_DATABASE_URL_FILE: /run/pms-secrets/pms-database-url
      PMS_WORKER_ID: pms-console-worker
      PMS_WORKER_POLL_INTERVAL_MS: "1000"
      PMS_WORKER_LEASE_DURATION_MS: "30000"
      PMS_WORKER_CLAIM_LIMIT: "10"
      PMS_WORKER_RETRY_DELAY_MS: "5000"
      PMS_WORKSPACE_ROOT: /app
      PMS_POSTGRES_PROVISIONING_CREDENTIAL_FILE: /run/pms-secrets/worker/postgres-provisioning.json
      PMS_RUNTIME_RELEASE_ROOT: /app/runtime-releases
      PMS_RUNTIME_SECRET_ROOT: /var/lib/sdar/runtime-secrets
      PMS_RUNTIME_CONFIG_CACHE_ROOT: /var/lib/sdar/runtime-cache
      PMS_RUNTIME_CONTROL_PLANE_URL: http://127.0.0.1:8090
      PMS_RUNTIME_CONTROL_PLANE_CREDENTIAL_ROOT: /var/lib/sdar/runtime-control-plane
      PMS_PM2_HOME: /var/lib/sdar/pm2
      PMS_RUNTIME_RECONCILE_INTERVAL_MS: "5000"
      PMS_RUNTIME_RECONCILE_TIMEOUT_MS: "30000"
      PMS_RUNTIME_HEALTH_TIMEOUT_MS: "3000"
    volumes:
      - type: bind
        source: ${PMS_CONSOLE_SECRET_ROOT:?PMS_CONSOLE_SECRET_ROOT is required}/pms-database-url
        target: /run/pms-secrets/pms-database-url
        read_only: true
      - type: bind
        source: ${PMS_CONSOLE_SECRET_ROOT:?PMS_CONSOLE_SECRET_ROOT is required}/worker
        target: /run/pms-secrets/worker
        read_only: true
      - type: bind
        source: ${PMS_CONSOLE_SECRET_ROOT:?PMS_CONSOLE_SECRET_ROOT is required}/runtime-control-plane
        target: /var/lib/sdar/runtime-control-plane
        read_only: true
      - pms-worker-state:/var/lib/sdar
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=1000,gid=1000
    depends_on:
      pms-postgres:
        condition: service_healthy
      pms-api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s

  pms-web:
    image: sdar/pms-web:${PMS_CONSOLE_GIT_SHA:-unverified}
    build:
      context: ${PMS_CONSOLE_BUILD_CONTEXT:-../..}
      dockerfile: Dockerfile
      target: pms-web
      args:
        VCS_REF: ${PMS_CONSOLE_GIT_SHA:-unverified}
        VITE_PMS_DATA_MODE: api
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      PMS_WEB_DATA_MODE: api
      PMS_WEB_API_BASE: /api/console/v1
      PMS_WEB_API_UPSTREAM: http://pms-api:8090
      PMS_WEB_HOST: 0.0.0.0
      PMS_WEB_PORT: "8080"
      PMS_WEB_PROXY_MAX_BODY_BYTES: ${PMS_WEB_PROXY_MAX_BODY_BYTES:-1048576}
      PMS_WEB_PROXY_TIMEOUT_MS: ${PMS_WEB_PROXY_TIMEOUT_MS:-10000}
    ports:
      - "${PMS_WEB_BIND_ADDRESS:-127.0.0.1}:${PMS_WEB_PORT:-8088}:8080"
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    depends_on:
      pms-api:
        condition: service_healthy
    networks:
      - pms-console
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

networks:
  pms-console:
    driver: bridge

volumes:
  pms-postgres-data:
  pms-worker-state:

secrets:
  pms_postgres_password:
    file: ${PMS_CONSOLE_SECRET_ROOT:?PMS_CONSOLE_SECRET_ROOT is required}/postgres-password
